<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FleetCare PPM/CM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interactive prototype of a preventive and corrective maintenance system for an airport refueller fleet. Fictional data.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: control-room console. Top bar with role switch, tab strip, one working panel; detail opens in a side drawer. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --sunk:#e3e8ec; --line:#cdd5dc; --ink:#14202b; --muted:#566573;
  --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#dbe8f2;
  --good:#1e7a45; --good-soft:#dcf0e3; --warn:#9a5b00; --warn-soft:#fbecd2; --bad:#b0281f; --bad-soft:#fbe1de;
  --tA:#ffffff; --tA-ink:#14202b; --tB:#cdebd3; --tB-ink:#14532d; --tC:#fbe9a6; --tC-ink:#5c4400; --tD:#f6c2bd; --tD-ink:#7a1d15; --tW:#d4e4f7; --tW-ink:#1b3f66;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#17212a; --sunk:#111a21; --line:#2b3a47; --ink:#e4ebf1; --muted:#97a7b5;
  --accent:#6fb1e0; --accent-ink:#06192a; --accent-soft:#183247;
  --good:#6fd39a; --good-soft:#143323; --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#ff8f84; --bad-soft:#3f1b18;
  --tA:#26323c; --tA-ink:#e4ebf1; --tB:#1d3b27; --tB-ink:#a6e3b7; --tC:#3d3412; --tC-ink:#f3dc8a; --tD:#47201c; --tD-ink:#ffb4ab; --tW:#1b2f45; --tW-ink:#a9cdf2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#17212a; --sunk:#111a21; --line:#2b3a47; --ink:#e4ebf1; --muted:#97a7b5;
  --accent:#6fb1e0; --accent-ink:#06192a; --accent-soft:#183247;
  --good:#6fd39a; --good-soft:#143323; --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#ff8f84; --bad-soft:#3f1b18;
  --tA:#26323c; --tA-ink:#e4ebf1; --tB:#1d3b27; --tB-ink:#a6e3b7; --tC:#3d3412; --tC-ink:#f3dc8a; --tD:#47201c; --tD-ink:#ffb4ab; --tW:#1b2f45; --tW-ink:#a9cdf2;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(26px,5vw,36px);line-height:1}
h2{font-size:22px}
h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 18px}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .sub{color:var(--muted);font-size:14px}
.demo-flag{display:inline-block;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:2px 7px;align-self:flex-start}
.roles{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.roles .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-right:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;padding:7px 11px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.clock{font-family:var(--mono);font-size:12.5px;color:var(--muted)}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 12px;color:var(--muted);white-space:nowrap;font-weight:600}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font-family:var(--mono);font-size:11px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:1px 6px;margin-left:5px}

.panel{display:flex;flex-direction:column;gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.bad{border-color:var(--bad)} .kpi.bad b{color:var(--bad)}
.kpi.warn{border-color:var(--warn)} .kpi.warn b{color:var(--warn)}
.kpi.good b{color:var(--good)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.alerts li{display:grid;grid-template-columns:6px minmax(0,1fr);gap:10px;align-items:stretch;background:var(--sunk);border-radius:6px;padding:8px 10px 8px 0;font-size:14px}
.alerts li::before{content:"";border-radius:0 3px 3px 0;background:var(--muted)}
.alerts li.bad::before{background:var(--bad)} .alerts li.warn::before{background:var(--warn)} .alerts li.info::before{background:var(--accent)}
.alerts li small{display:block;color:var(--muted);font-size:12.5px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk);font-weight:600}
tr:last-child td{border-bottom:0}
td{background:var(--surface)}
td.wrap{white-space:normal;min-width:200px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}

/* schedule board */
.board td,.board th{text-align:center;padding:5px 4px}
.board th:first-child,.board td:first-child{text-align:left;padding-left:9px}
.cell{display:inline-flex;align-items:center;justify-content:center;gap:3px;width:42px;height:30px;border-radius:5px;border:1px solid var(--line);font-family:var(--mono);font-size:12.5px;font-weight:500}
button.cell{padding:0}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.tA{background:var(--tA);color:var(--tA-ink)} .tB{background:var(--tB);color:var(--tB-ink)} .tC{background:var(--tC);color:var(--tC-ink)} .tD{background:var(--tD);color:var(--tD-ink)} .tW{background:var(--tW);color:var(--tW-ink)}
.ic{font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.legend .cell{width:26px;height:20px;font-size:11px}

/* pills */
.pill{display:inline-block;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.cat{font-family:var(--mono);font-size:11.5px;border-radius:3px;padding:1px 5px;background:var(--sunk);border:1px solid var(--line)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select,.toolbar input{width:auto}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:8px 10px}
.lock-note{font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 10px}

/* vehicle cards */
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.vcard{text-align:left;display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:9px;background:var(--surface);border:1px solid var(--line);width:100%}
.vcard .id{font-family:var(--display);font-size:24px;line-height:1}
.vcard.gr{border-color:var(--bad)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.45);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:31;overflow-y:auto;border-left:1px solid var(--line);
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
.d-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rows{display:grid;grid-template-columns:minmax(110px,140px) minmax(0,1fr);gap:5px 12px;font-size:14px}
.rows dt{color:var(--muted)} .rows dd{margin:0;overflow-wrap:anywhere}
.check{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.check li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:14px}
.check li input[type=checkbox]{width:18px;height:18px;margin:0}
.check li input.q{width:84px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:460px){.fgrid{grid-template-columns:1fr}}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.timeline li{border-left:3px solid var(--accent);padding:4px 0 4px 10px;font-size:14px}
.timeline li small{display:block;color:var(--muted)}
.items{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:7px;z-index:40;font-weight:500;max-width:calc(100% - 32px)}

/* how it works */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px}
.flow span{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
.flow i{color:var(--muted);font-style:normal}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.cols3{grid-template-columns:1fr}}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
footer{color:var(--muted);font-size:12.5px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="demo-flag">Prototype · fictional data</span>
      <h1>FleetCare PPM/CM</h1>
      <div class="sub">Maintenance console for 5 aviation refuellers at an airport fuel terminal</div>
    </div>
    <div class="roles">
      <span class="lbl">View as</span>
      <div class="seg" id="roles" role="group" aria-label="User role"></div>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <main class="panel" id="panel" aria-live="polite"></main>
  <footer>Prototype of a system in production use. All units, people, order numbers and rates here are invented. <button id="reset" style="margin-left:6px;padding:3px 9px;font-size:12px">Reset demo</button></footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-label="Details"></aside>

<script>
(function(){
"use strict";
/* ---------- fixed demo clock ---------- */
var TODAY="2026-10-23", YEAR=2026, CUR_M=10;
var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var H_OPS=16, PENALTY=500; // operating hours per day; demo penalty per late day per unit (configurable)

/* ---------- master lists ---------- */
var VEH=[
  {id:"RF-201",type:"Refueller 40 kL",series:"L",rot:"ABAADAABAACA"},
  {id:"RF-202",type:"Refueller 40 kL",series:"L",rot:"BAADAABAACAA"},
  {id:"RF-203",type:"Refueller 40 kL",series:"L",rot:"AADAABAACAAB"},
  {id:"RF-204",type:"Refueller 40 kL",series:"L",rot:"ADAABAACAABA"},
  {id:"RF-110",type:"Hydrant dispenser",series:"S",rot:"DAABAACAABAA"}
];
var TASK={
  W:{name:"Weekly interlock & bonding",limitH:null},
  A:{name:"PM Task A · monthly",limitH:24},
  B:{name:"PM Task B · 3-monthly",limitH:48},
  C:{name:"PM Task C · 6-monthly",limitH:48},
  D:{name:"PM Task D · 12-monthly",limitH:72}
};
var CHECK={
  W:[["Bonding cable continuity"],["Bonding clip"],["Bonding insulation layer"],["Wire terminal"],["Stowage point"],["Interlock visual & function test"]],
  A:[["Lights: signal, tail, head (replace bulbs as needed)"],["Tyres: pressure and tread"],["Brake air system leak check"],["Deadman control function"],["Fire extinguishers in date"],["Fuel filter water drain"],["Hose reel and nozzle visual"],["Emergency stop test"]],
  B:[["Engine oil change","L"],["Oil filter","pcs"],["Bypass filter","pcs"],["Fuel filter","pcs"],["Gearbox top-up","L"],["Hydraulic top-up","L"]],
  C:[["Water separator","pcs"],["Air dryer filter","pcs"],["Gearbox filter","pcs"],["Hydraulic filter","pcs"]],
  D:[["Hydraulic oil change","L"],["Coolant change","L"],["Air filter","pcs"],["Full chassis lubrication"]]
};
function checklistFor(code){
  if(code==="W") return CHECK.W;
  var list=CHECK.A.slice();
  if("BCD".indexOf(code)>=0) list=list.concat(CHECK.B);
  if("CD".indexOf(code)>=0) list=list.concat(CHECK.C);
  if(code==="D") list=list.concat(CHECK.D);
  return list;
}
var KIT={L:{B:{"Engine oil (L)":35,"Oil filter":2,"Bypass filter":1,"Fuel filter":1},C:{"Engine oil (L)":35,"Oil filter":2,"Bypass filter":1,"Fuel filter":1,"Water separator":1,"Air dryer filter":1,"Wiper":2},D:{"Engine oil (L)":35,"Oil filter":3,"Fuel filter":1,"Air dryer filter":1,"Water separator":1,"Gearbox filter":2,"Gearbox oil (L)":40,"Hydraulic filter":1}},
         S:{B:{"Engine oil (L)":7,"Oil filter":1,"Fuel filter":1},C:{"Engine oil (L)":9,"Oil filter":1,"Fuel filter":1},D:{"Engine oil (L)":7,"Oil filter":1,"Fuel filter":1,"Air filter":1,"Hydraulic oil (L)":70,"Coolant (L)":5}}};
var CATS=[
  {g:"Engine / chassis",c:"MECH",n:"Chassis mechanical"},{g:"Engine / chassis",c:"ENG",n:"Engine"},{g:"Engine / chassis",c:"AIRC",n:"Cab air-con"},
  {g:"Engine / chassis",c:"ELEC",n:"Vehicle electrical"},{g:"Engine / chassis",c:"MISC",n:"Other chassis"},
  {g:"Refuelling",c:"HYDR",n:"Refuel hydraulics"},{g:"Refuelling",c:"PNEU",n:"Pneumatics"},{g:"Refuelling",c:"ELEC-R",n:"Refuel electrical / interlock"},
  {g:"Refuelling",c:"INST",n:"Instruments"},{g:"Refuelling",c:"REFU",n:"Refuel components"},{g:"Refuelling",c:"MISC-R",n:"Other refuel"}
];
var CM_STATUS=["Reported","Under repair","Awaiting parts","Awaiting third party","Monitoring","Closed"];
var TECHS=["Amir","Hafiz","Daniel","Kumar"];
var ROLES=[{k:"tech",l:"Technician",who:"Amir"},{k:"coord",l:"Coordinator",who:"Coordinator"},{k:"client",l:"Client",who:"Client rep"}];

/* ---------- seed data ---------- */
function seed(){
  var pm={}, mo=90815700;
  VEH.forEach(function(v,vi){
    for(var m=1;m<=12;m++){
      var code=v.rot[m-1], key=v.id+"-"+m, r={veh:v.id,m:m,code:code,mo:"",moStart:"",moEnd:"",aStart:"",aEnd:"",status:"Not started",checks:{},qty:{},by:""};
      if(m<CUR_M){
        var d=3+vi*4, dur=code==="A"?1:code==="D"?3:2;
        r.mo=String(mo++); r.moStart=ymd(YEAR,m,d); r.moEnd=ymd(YEAR,m,d+dur);
        r.aStart=r.moStart+"T08:00"; r.aEnd=ymd(YEAR,m,d+(m===6&&vi===2?dur+1:dur-1))+"T"+(m===6&&vi===2?"17:00":"16:30");
        r.status="Done"; r.by=TECHS[(m+vi)%4]; checklistFor(code).forEach(function(_,i){r.checks[i]=true});
      }
      pm[key]=r;
    }
  });
  // October: RF-202 done, RF-203 in progress, RF-201 order received, RF-204 (grounded) and RF-110 not started
  var o=function(id){return pm[id+"-10"]};
  Object.assign(o("RF-202"),{mo:"90820031",moStart:"2026-10-05",moEnd:"2026-10-07",aStart:"2026-10-05T08:00",aEnd:"2026-10-06T15:30",status:"Done",by:"Hafiz"});
  checklistFor("C").forEach(function(_,i){o("RF-202").checks[i]=true});
  Object.assign(o("RF-203"),{mo:"90820054",moStart:"2026-10-22",moEnd:"2026-10-23",aStart:"2026-10-22T09:00",aEnd:"",status:"In progress",by:"Daniel"});
  [0,1,2,3,4].forEach(function(i){o("RF-203").checks[i]=true});
  Object.assign(o("RF-201"),{mo:"90820061",moStart:"2026-10-26",moEnd:"2026-10-27"});

  var weeks=[["2026-09-29","2026-10-05"],["2026-10-06","2026-10-12"],["2026-10-13","2026-10-19"],["2026-10-20","2026-10-26"],["2026-10-27","2026-11-02"]];
  var wk=[], wmo=90820100;
  weeks.forEach(function(w,wi){
    VEH.forEach(function(v,vi){
      var r={id:"W"+wi+"-"+v.id,veh:v.id,week:wi,mo:wi<4?String(wmo++):"",moStart:w[0],moEnd:w[1],aEnd:"",ohm:"",status:"Not started",checks:{},by:""};
      if(wi<3 || (wi===3 && vi<3)){
        r.status="Done"; r.aEnd=addDays(w[0],2); r.ohm=(4+((vi*7+wi*3)%9)).toFixed(1); r.by=TECHS[(wi+vi)%4];
        CHECK.W.forEach(function(_,i){r.checks[i]=true});
      }
      if(wi===3 && v.id==="RF-204"){ r.status="Under maintenance"; }
      wk.push(r);
    });
  });

  var cms=[
    {no:"CM-0412",veh:"RF-204",reported:"2026-10-21T07:40",by:"Operator (night shift)",grounded:true,gAt:"2026-10-21T07:40",rAt:"",status:"Awaiting parts",
      items:[{cat:"HYDR",fault:"Hydraulic hose leaking at PTO outlet",repair:"",parts:"Hydraulic hose 1\" x 1.2 m",cost:"",payer:"Client stock",tech:["Kumar"]}],
      log:[{at:"2026-10-21T09:15",tech:["Kumar"],work:"Isolated leak, hose cracked at crimp. Unit grounded.",status:"Under repair"},
           {at:"2026-10-22T10:00",tech:["Kumar","Amir"],work:"Hose not in client stock. Purchase request raised.",status:"Awaiting parts"}]},
    {no:"CM-0411",veh:"RF-201",reported:"2026-10-19T14:05",by:"Operator (day shift)",grounded:false,gAt:"",rAt:"",status:"Monitoring",
      items:[{cat:"ELEC-R",fault:"Interlock indicator flickers during hose reel rewind",repair:"Cleaned and re-crimped relay connector",parts:"",cost:"",payer:"Contractor",tech:["Amir"]}],

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,"0")}
function ymd(y,m,d){var dt=new Date(Date.UTC(y,m-1,d));return dt.getUTCFullYear()+"-"+pad(dt.getUTCMonth()+1)+"-"+pad(dt.getUTCDate())}
function addDays(s,n){var p=s.split("-");return ymd(+p[0],+p[1],+p[2]+n)}
function fmtD(s){if(!s)return "—";var p=s.slice(0,10).split("-");return +p[2]+" "+MONTHS[+p[1]-1]}
function fmtDT(s){if(!s)return "—";return fmtD(s)+(s.length>10?", "+s.slice(11,16):"")}
function hoursBetween(a,b){return (new Date(b)-new Date(a))/36e5}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function nowStamp(){return TODAY+"T"+new Date().toTimeString().slice(0,5)}
function daysLeftInMonth(){return new Date(Date.UTC(YEAR,CUR_M,0)).getUTCDate()-(+TODAY.slice(8,10))}
var $=function(id){return document.getElementById(id)};

/* ---------- state ---------- */
var KEY="fleetcare-demo-v1", S;
try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
if(!S||!S.pm) S=seed();

function role(){return S.role}
function can(action){
  var r=role();
  if(r==="client") return action==="view";
  if(r==="tech") return ["view","reportCM","updateCM","doPM","doWeekly"].indexOf(action)>=0;
  return true;
}
function audit(msg){S.audit.unshift({at:nowStamp(),who:ROLES.filter(function(r){return r.k===role()})[0].who,msg:msg});S.audit=S.audit.slice(0,40)}

/* ---------- derived ---------- */
function pmRec(v,m){return S.pm[v+"-"+m]}
function pmState(r){
  if(r.status==="Done") return "done";
  if(r.aStart) return "prog";
  if(r.m<CUR_M) return "missed";
  return r.m===CUR_M?"due":"future";
}
function pmDuration(r){if(!r.aStart||!r.aEnd)return null;return hoursBetween(r.aStart,r.aEnd)}
function pmLate(r){var h=pmDuration(r),lim=TASK[r.code].limitH;if(h==null||!lim)return 0;return h>lim?Math.ceil((h-lim)/24):0}
function openCM(v){return S.cms.filter(function(c){return c.status!=="Closed"&&(!v||c.veh===v)})}
function groundedCM(v){return S.cms.filter(function(c){return c.grounded&&!c.rAt&&c.status!=="Closed"&&c.veh===v})[0]}
function unitState(v){
  if(groundedCM(v)) return {k:"Grounded",cls:"bad"};
  var r=pmRec(v,CUR_M); if(r.status==="In progress"&&!r.aEnd) return {k:"In PM",cls:"warn"};
  return {k:"Available",cls:"good"};
}
function curWeek(){return S.wk.filter(function(w){return w.moStart<=TODAY&&w.moEnd>=TODAY})}
function weekIdx(){var c=curWeek();return c.length?c[0].week:3}

function alerts(){
  var out=[], left=daysLeftInMonth(), d=+TODAY.slice(8,10);
  VEH.forEach(function(v){
    var g=groundedCM(v.id);
    if(g) out.push({cls:"bad",t:v.id+" grounded since "+fmtDT(g.gAt),s:g.no+" · "+g.items[0].fault+" · "+g.status});
  });
  VEH.forEach(function(v){
    var r=pmRec(v.id,CUR_M);
    if(r.status!=="Done"){
      var sev=left<=3?"bad":(d>=20?"warn":"info");
      out.push({cls:sev,t:v.id+" "+TASK[r.code].name+" not complete",s:(r.mo?"MO "+r.mo+" · ":"No MO received yet · ")+left+" days left in "+MONTHS[CUR_M-1]});
    }
    if(r.aStart&&!r.aEnd&&TASK[r.code].limitH){
      var h=hoursBetween(r.aStart,TODAY+"T08:00");
      if(h>TASK[r.code].limitH) out.push({cls:"bad",t:v.id+" PM over the "+TASK[r.code].limitH+" h limit",s:"Running "+Math.round(h)+" h. Estimated penalty RM "+(Math.ceil((h-TASK[r.code].limitH)/24)*PENALTY).toLocaleString()});
    }
  });
  var wk=curWeek().filter(function(w){return w.status==="Not started"});
  if(wk.length) out.push({cls:"warn",t:wk.length+(wk.length===1?" weekly check":" weekly checks")+" pending this week",s:wk.map(function(w){return w.veh}).join(", ")+" · window ends "+fmtD(curWeek()[0].moEnd)});
  if(d>=15){
    var nm=CUR_M+1, need=stockNeeds(nm), names=Object.keys(need);
    if(names.length) out.push({cls:"info",t:"Prepare stock for "+MONTHS[nm-1]+" PM",s:names.map(function(n){return n+" "+need[n]}).join(", ")});
  }
  return out;
}
function stockNeeds(m){
  var tot={};
  VEH.forEach(function(v){var c=v.rot[m-1];if(c==="A")return;var k=KIT[v.series][c];Object.keys(k).forEach(function(n){tot[n]=(tot[n]||0)+k[n]})});
  return tot;
}
function availabilityMonth(){
  // availability % = 1 - (PM hours + CM hours) / (units x operating hours x days), clipped to month-to-date
  var days=+TODAY.slice(8,10), total=VEH.length*H_OPS*days, down=0, from=YEAR+"-"+pad(CUR_M)+"-01T00:00", to=TODAY+"T23:59";
  function clip(a,b){if(!a)return 0;var s=a<from?from:a,e=(b&&b<to)?b:TODAY+"T16:00";if(e<=s)return 0;return Math.min(hoursBetween(s,e),H_OPS*Math.ceil(hoursBetween(s,e)/24))*(H_OPS/24)}
  VEH.forEach(function(v){var r=pmRec(v.id,CUR_M);if(r.aStart)down+=clip(r.aStart,r.aEnd)});
  S.cms.forEach(function(c){if(c.grounded)down+=clip(c.gAt,c.rAt)});
  return {pct:Math.max(0,100*(1-down/total)),down:down,total:total};
}

function pmSave(done){
  var r=S.pm[drawerCtx.key], list=checklistFor(r.code);

  if((as&&as.slice(0,10)>TODAY)||(ae&&ae.slice(0,10)>TODAY)) return toast("Dates cannot be in the future.");
  r.aStart=as; r.aEnd=ae;

  document.querySelectorAll("[data-q]").forEach(function(q){r.qty[q.getAttribute("data-q")]=q.value.trim()});

function wkDone(){

  var all=[].every.call(document.querySelectorAll("[data-ck]"),function(c){return c.checked});
  if(isNaN(ohm)) return toast("Enter the continuity reading in ohms.");
  if(!d||d>TODAY) return toast("Completion date cannot be empty or in the future.");
  w.ohm=ohm.toFixed(1); w.aEnd=d; CHECK.W.forEach(function(_,i){w.checks[i]=document.querySelector('[data-ck="'+i+'"]').checked});
  if(ohm>=25){
    var no=newCM(w.veh,false,[{cat:"ELEC-R",fault:"Bonding continuity "+ohm.toFixed(1)+" Ω (limit < 25 Ω) on weekly check",repair:"",parts:"",cost:"",payer:"",tech:[]}],"Weekly check");
    w.status="Failed"; audit(w.veh+" weekly check failed at "+ohm.toFixed(1)+" Ω, "+no+" opened");
    save(); closeDrawer(); render(); return toast("Failed at "+ohm.toFixed(1)+" Ω. "+no+" opened.");
  }
  if(!all) return toast("Tick every check before submitting.");
  w.status="Done"; w.by=ROLES.filter(function(x){return x.k===role()})[0].who; audit(w.veh+" weekly check done ("+w.ohm+" Ω)");

}

function cmAct(kind){
  var c=S.cms.filter(function(x){return x.no===drawerCtx.no})[0];

    var w=$("l-w").value.trim(); if(!w) return toast("Describe the work done.");
    var techs=[]; c.items.forEach(function(i){i.tech.forEach(function(t){if(techs.indexOf(t)<0)techs.push(t)})});
    var st=$("l-s").value; c.log.push({at:nowStamp(),tech:techs.length?techs:[ROLES.filter(function(x){return x.k===role()})[0].who],work:w,status:st}); c.status=st;
    audit(c.no+" log added: "+st); toast("Added to log.");
  } else if(kind==="release"){
    c.rAt=nowStamp(); audit(c.veh+" released ("+c.no+")"); toast(c.veh+" is available again.");
  } else if(kind==="close"){
    var miss=[];
    c.items.forEach(function(i,n){if(!i.cat)miss.push("category for item "+(n+1));if(!i.repair)miss.push("repair for item "+(n+1));if(!i.tech.length)miss.push("who repaired item "+(n+1))});
    if(!c.log.length) miss.push("at least one work log entry");
    if(c.grounded&&!c.rAt) miss.push("release time");
    if(miss.length){save();return toast("Cannot close yet. Missing: "+miss.join(", ")+".")}
    c.status="Closed"; audit(c.no+" closed"); toast(c.no+" closed.");
  } else { audit(c.no+" items updated"); toast("Saved."); }
  save(); render(); drawCM(c.no);
}

document.addEventListener("click",function(e){

  if(t.hasAttribute("data-pm")) return drawPM(t.getAttribute("data-pm"));
  if(t.hasAttribute("data-wk")) return drawWK(t.getAttribute("data-wk"));
  if(t.hasAttribute("data-cm")) return drawCM(t.getAttribute("data-cm"));
  if(t.hasAttribute("data-unit")) return drawUnit(t.getAttribute("data-unit"));
  switch(t.id){
    case "newCM": return drawNewCM();
    case "saveCM": return saveNewCM();
    case "addItem": var box=$("n-items");box.insertAdjacentHTML("beforeend",itemForm(box.children.length));return;
    case "pmSave": return pmSave(false);
    case "pmDone": return pmSave(true);
    case "wkDone": return wkDone();
    case "bulkW": return bulkWeekly();
    case "addLog": return cmAct("log");
    case "cmSave": return cmAct("save");
    case "cmRelease": return cmAct("release");
    case "cmClose": return cmAct("close");
    case "reset": S=seed();save();closeDrawer();render();return toast("Demo data reset.");
  }
});
function reopen(ctx){({pm:function(){drawPM(ctx.key)},wk:function(){drawWK(ctx.id)},cm:function(){drawCM(ctx.no)},unit:function(){drawUnit(ctx.id)},newcm:function(){can("reportCM")?drawNewCM():closeDrawer()}})[ctx.k]()}
document.addEventListener("change",function(e){
  var id=e.target.id;
  if(id==="ppmf"){ppmFilter=e.target.value;render()}
  if(id==="cmS"){cmF.status=e.target.value;render();$("cmS").value=cmF.status;$("cmV").value=cmF.veh;$("cmC").value=cmF.cat}
  if(id==="cmV"){cmF.veh=e.target.value;render();$("cmS").value=cmF.status;$("cmV").value=cmF.veh;$("cmC").value=cmF.cat}
  if(id==="cmC"){cmF.cat=e.target.value;render();$("cmS").value=cmF.status;$("cmV").value=cmF.veh;$("cmC").value=cmF.cat}
});
$("scrim").addEventListener("click",closeDrawer);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("drawer").hidden)closeDrawer()});

var h=(location.hash||"").slice(1); if(TABS.some(function(t){return t.k===h})) S.tab=h;
render();
if(S.tab==="cm"){$("cmS").value=cmF.status}
})();
</script>
